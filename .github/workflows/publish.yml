name: publish

on:
  workflow_call:
    inputs:
      version:
        description: The version being published, as three numbers.
        required: true
        type: string

permissions:
  contents: write

env:
  DART_SDK: 3.12.2

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            ext: ""
          - runner: macos-latest
            target: macos
            ext: ""
          - runner: windows-latest
            target: windows
            ext: ".exe"

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Build scribe for ${{ matrix.target }}
        run: |
          set -eu
          bash tool/build.sh "$GITHUB_WORKSPACE/out/${{ matrix.target }}"

      - name: Check that what was built says the version it was asked for
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          said=$(./out/${{ matrix.target }}/scribe${{ matrix.ext }} --version)
          [ "$said" = "scribe $VERSION" ] || {
            echo "the build says $said and the release is $VERSION" >&2
            exit 1
          }
          echo "the ${{ matrix.target }} build says $said"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scribe-${{ matrix.target }}
          path: out/${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scribe-*
          path: incoming

      - name: Name each binary after its platform
        run: |
          set -eu
          mkdir -p assets
          for target in linux macos windows; do
            extension=""
            [ "$target" = windows ] && extension=".exe"
            cp "incoming/scribe-$target/scribe$extension" "assets/scribe_$target$extension"
          done
          ls -lh assets

      - name: Take the launchers along, since they are what goes on a PATH
        run: |
          set -eu
          cp launcher/scribe launcher/scribe.cmd assets/
          chmod +x assets/scribe
          ls -lh assets/scribe assets/scribe.cmd

      - name: Pack the templates the binary reads at runtime
        run: |
          set -eu
          tar -czf assets/scribe-templates.tar.gz templates
          ls -lh assets/scribe-templates.tar.gz

      - name: Attach them to this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" assets/* --clobber --repo ${{ github.repository }}
