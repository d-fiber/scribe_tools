name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scribe_tools

      # The ops tests read the capacity files and the compose templates that
      # ship, so the framework has to sit next to the package, the way the two
      # checkouts sit locally.
      - name: Check out scribe
        uses: actions/checkout@v4
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe
          ssh-key: ${{ secrets.SCRIBE_DEPLOY_KEY }}

      - name: Check out the packages submodule
        working-directory: scribe
        env:
          PACKAGES_READ_KEY: ${{ secrets.PACKAGES_READ_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$PACKAGES_READ_KEY" > ~/.ssh/packages
          chmod 600 ~/.ssh/packages
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/packages -o IdentitiesOnly=yes" \
            git submodule update --init --recursive

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Analyze
        working-directory: scribe_tools
        run: |
          dart pub get
          dart analyze

      - name: Run tests
        working-directory: scribe_tools
        run: dart test

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        run: bash .github/headers/check.sh

  publish:
    needs: [headers, scribe]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'd-fiber/scribe_tools'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
